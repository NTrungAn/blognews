spring.application.name=blogsystem

# ── Database Defaults (Chỉ cấu hình chung, thông tin nhạy cảm lưu ở application-local.properties) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blogsystemdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ── File Upload ───────────────────────────────────────────────
# Thư mục lưu ảnh upload (tương đối với thư mục chạy ứng dụng)
app.upload.dir=uploads
# Giới hạn kích thước mỗi file (5MB)
spring.servlet.multipart.max-file-size=5MB
# Giới hạn tổng kích thước toàn bộ request multipart (10MB)
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.security=DEBUG
server.error.include-message=always
server.error.include-exception=true

# Tự động nạp file cấu hình bảo mật local (không đẩy lên git)
spring.config.import=optional:classpath:application-local.properties