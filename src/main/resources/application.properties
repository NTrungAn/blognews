spring.application.name=blogsystem

# ── Database Defaults (Chỉ cấu hình chung, thông tin nhạy cảm lưu ở application-local.properties) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blogsystemdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ── File Upload ───────────────────────────────────────────────
# Thư mục lưu ảnh upload (tương đối với thư mục chạy ứng dụng)
app.upload.dir=uploads
# Giới hạn kích thước mỗi file (5MB)
spring.servlet.multipart.max-file-size=5MB
# Giới hạn tổng kích thước toàn bộ request multipart (10MB)
spring.servlet.multipart.max-request-size=10MB

# ── Storage Provider ──────────────────────────────────────────
# Chọn nơi lưu ảnh: local (thư mục uploads/) | cloudinary
app.storage.type=${STORAGE_TYPE:local}

# ── Cloudinary (giá trị thật đặt trong application-local.properties hoặc biến môi trường) ──
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:blognews/images}

logging.level.org.springframework.security=DEBUG
server.error.include-message=always
server.error.include-exception=true

# ── JWT Configuration ─────────────────────────────────────────
jwt.secret=${JWT_SECRET:DefaultDevSecretKeyMustBeAtLeast64CharsLong2026_123456789012345678}
jwt.refresh-secret=${JWT_REFRESH_SECRET:DefaultDevRefreshSecretMustBeAtLeast64CharsLong2026_123456789012}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.max-sessions=5
jwt.issuer=blogsystem-api

# Tự động nạp file cấu hình bảo mật local (ưu tiên đọc file trực tiếp từ source nếu chạy trong IDE)
spring.config.import=optional:classpath:application-local.properties,optional:file:./src/main/resources/application-local.properties,optional:file:./blogsystem/src/main/resources/application-local.properties