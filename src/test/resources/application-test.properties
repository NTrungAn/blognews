# ── Database (Sử dụng chung database local nhưng Rollback sau mỗi test) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blogsystemdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true

# ── JWT Secret (Test override) ────────────────────────────────
jwt.secret=ThisIsASecretKeyForTestingPurposesOnlyDoNotUseInProd1234567890ABCD
jwt.refresh-secret=ThisIsARefreshSecretKeyForTestingOnlyDoNotUseInProd1234567890ABCD
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=86400000
jwt.max-sessions=5

# ── Logging ───────────────────────────────────────────────────
logging.level.org.springframework.test=INFO
logging.level.com.blog.blogsystem=DEBUG

# Nạp cấu hình bảo mật local (DB password, etc.)
spring.config.import=optional:classpath:application-local.properties,optional:file:./src/main/resources/application-local.properties
