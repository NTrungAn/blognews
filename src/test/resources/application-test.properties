# ── Database (Sử dụng chung database local nhưng Rollback sau mỗi test) ──
spring.datasource.url=jdbc:postgresql://localhost:5432/blogsystemdb
spring.datasource.username=postgres
spring.datasource.password=Trungan1@
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true

# ── JWT Secret (Test override) ────────────────────────────────
jwt.secret=ThisIsASecretKeyForTestingPurposesOnlyDoNotUseInProd1234567890
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# ── Logging ───────────────────────────────────────────────────
logging.level.org.springframework.test=INFO
logging.level.com.blog.blogsystem=DEBUG
